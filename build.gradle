plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
}

group = 'me.vikrant.plugin'
version = '2.0'

java {
    // Paper 1.21.6 requires Java 21
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    // paperweight-userdev gives typed, Mojang-mapped access to NMS classes.
    // Paper 1.21.6 build 26.1+ ships unobfuscated, so no runtime remapping step
    // is needed — paperweight only affects the compile classpath here.
    paperweight.paperDevBundle("1.21.6-R0.1-SNAPSHOT")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.processResources {
    inputs.property "version", version
    filteringCharset "UTF-8"
    filesMatching('plugin.yml') {
        expand version: version
    }
}
